<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OCP Global Summit Invite — Design Options</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F9F9F9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box; }

  .toolbar {
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:16px;
    padding:14px 24px;
    background:#1A1A1A;
    color:#FFFFFF;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .toolbar-label {
    font-family:'Object Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size:16px; font-weight:400; line-height:1.3;
    color:#FFFFFF; white-space:nowrap; margin-right:24px;
  }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .tab {
    appearance:none; border:1px solid #3A3A3A; background:#242424; color:#FFFFFF;
    padding:9px 16px; font-size:14px; font-weight:500; border-radius:6px; cursor:pointer;
    line-height:1.3;
  }
  .tab:hover { background:#2E2E2E; border-color:#4A4A4A; }
  .tab.active { background:#FF3300; border-color:#FF3300; }

  .viewer-wrap { padding:32px 0 64px; }
  .viewer-frame {
    display:block; width:100%; max-width:644px; margin:0 auto;
    border:0; background:#F9F9F9; overflow:hidden;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <span class="toolbar-label">OCP Networking Invite Email 0902</span>
    <div class="tabs" id="tabs">
      <button class="tab active" data-src="option-1.html" data-index="0">Option 1</button>
      <button class="tab" data-src="option-2.html" data-index="1">Option 2</button>
      <button class="tab" data-src="option-3.html" data-index="2">Option 3</button>
    </div>
  </div>

  <div class="viewer-wrap">
    <iframe id="viewer" class="viewer-frame" src="option-1.html" title="Email design preview" scrolling="no" frameborder="0"></iframe>
  </div>

  <script>
    var tabs = document.querySelectorAll('.tab');
    var viewer = document.getElementById('viewer');

    function resizeViewer() {
      try {
        var doc = viewer.contentWindow.document;
        var height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
        viewer.style.height = (height + 4) + 'px';
      } catch (e) {
        viewer.style.height = '1600px';
      }
    }

    viewer.addEventListener('load', function () {
      resizeViewer();
      try {
        var images = viewer.contentWindow.document.images;
        Array.prototype.forEach.call(images, function (img) {
          if (!img.complete) {
            img.addEventListener('load', resizeViewer);
            img.addEventListener('error', resizeViewer);
          }
        });
        // Fonts/images can finish just after load fires; true up shortly after.
        setTimeout(resizeViewer, 150);
        setTimeout(resizeViewer, 500);
      } catch (e) {}
    });

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        viewer.src = tab.getAttribute('data-src');
      });
    });
  </script>

</body>
</html>
